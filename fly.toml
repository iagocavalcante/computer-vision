app = "computervision"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 5

[build]

[deploy]
  release_command = "bin/computer_vision eval 'ComputerVision.Release.migrate()'"

[env]
  PHX_SERVER = "true"
  PHX_HOST = "computervision.fly.dev"
  RTMP_PORT = "1935"
  STORAGE_TYPE = "local"
  STORAGE_DIR = "/app/output"
  REGISTRATION_OPEN = "true"
  TRANSCODING_ENABLED = "false"
  MAX_CONCURRENT_TRANSCODES = "2"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[services]]
  protocol = "tcp"
  internal_port = 1935

  [[services.ports]]
    port = 1935

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[mounts]
  source = "stream_data"
  destination = "/app/output"
